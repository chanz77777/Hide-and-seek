<use href="#hp-pizza" x="-30" y="-30" transform="translate(485 178) rotate(190)"/>
<use href="#hp-donut" x="-30" y="-30" transform="translate(540 184) rotate(-15)"/>
<use href="#hp-apple" x="-30" y="-30" transform="translate(590 190) rotate(25)"/>
<use href="#hp-fish" x="-30" y="-30" transform="translate(372 232) rotate(120)"/>
<use href="#hp-star" x="-30" y="-30" transform="translate(425 240) rotate(-40)"/>
<use href="#hp-heart" x="-30" y="-30" transform="translate(478 236) rotate(30)"/>
<use href="#hp-pizza" x="-30" y="-30" transform="translate(532 242) rotate(-100)"/>
<use href="#hp-star" x="-30" y="-30" transform="translate(588 238) rotate(70)"/>
</g>
<rect x="365" y="66" width="230" height="190" rx="10" fill="none" stroke="#2b2d33" stroke-width="1.5"/>
<use href="#hp-mann" x="-45" y="-20" transform="translate(480 161) rotate(-12)" color="#ffffff" stroke="#c9c5bc" stroke-width="1.5"/>
<g stroke="#2d6ad8" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#hp-arrow)">
<path d="M480 128V100" fill="none"/>
<path d="M480 194V222" fill="none"/>
<path d="M432 161H404" fill="none"/>
<path d="M528 161H556" fill="none"/>
</g>
<path d="M424 143A60 60 0 0 1 458 106" stroke="#2d6ad8" stroke-width="3" fill="none" stroke-linecap="round" marker-start="url(#hp-arrow)" marker-end="url(#hp-arrow)"/>
<path d="M536 179A60 60 0 0 1 502 216" stroke="#2d6ad8" stroke-width="3" fill="none" stroke-linecap="round" marker-start="url(#hp-arrow)" marker-end="url(#hp-arrow)"/>
<g font-size="14" font-weight="700" fill="#2b2d33" text-anchor="middle">
<g stroke="#2b2d33" stroke-width="1.5" fill="#ffffff">
<rect x="417" y="272" width="26" height="26" rx="5" fill="#ffffff"/>
<rect x="387" y="302" width="26" height="26" rx="5" fill="#ffffff"/>
