<rect x="531" y="287" width="26" height="26" rx="5" fill="#ffffff"/>
<rect x="571" y="287" width="26" height="26" rx="5" fill="#ffffff"/>
</g>
<text x="430" y="290">W</text><text x="400" y="320">A</text><text x="430" y="320">S</text><text x="460" y="320">D</text>
<text x="544" y="305">Q</text><text x="564" y="305" font-weight="400" fill="#6e717c">/</text><text x="584" y="305">E</text>
</g>
<text x="430" y="350" font-size="14" fill="#6e717c" text-anchor="middle">スライド移動</text>
<text x="564" y="350" font-size="14" fill="#6e717c" text-anchor="middle">回転</text>

<!-- ===== panel (c) ===== -->
<rect x="645" y="10" width="300" height="360" rx="14" fill="#ffffff" stroke="#e3dfd5" stroke-width="2"/>
