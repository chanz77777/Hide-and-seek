<g clip-path="url(#hp-mannclipL)"><g clip-path="url(#hp-leftclip)"><rect x="660" y="60" width="270" height="230" fill="url(#hp-dots)"/></g></g>
<path d="M795 100V250" stroke="#2b2d33" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
